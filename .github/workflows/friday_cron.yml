name: Auto Fetch Friday Price

on:
  schedule:
    # Run ທຸກໆວັນສຸກ ຕອນເວລາ 05:00 UTC (ປະມານ 12:00 ໂມງທ່ຽງ ຢູ່ລາວ)
    - cron: '0 5 * * 5'
    # Run ທຸກໆວັນສຸກ ຕອນເວລາ 16:55 UTC (ປະມານ 23:55 ໂມງກາງຄືນ ຢູ່ລາວ)
    - cron: '55 16 * * 5'
  workflow_dispatch:
    inputs:
      leg:
        description: "Choose whether this is the entry or exit price"
        required: true
        type: choice
        options:
          - entry
          - exit

permissions:
  contents: write

jobs:
  fetch-price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: python -m pip install yfinance pandas

      - name: Run script
        working-directory: 22222222222222222
        env:
          FRIDAY_LEG: ${{ github.event.schedule == '0 5 * * 5' && 'entry' || github.event.schedule == '55 16 * * 5' && 'exit' || inputs.leg }}
        run: python fetch_friday_price.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'FridayBot'
          git config --global user.email 'bot@friday.effect'
          git add 22222222222222222/friday_auto_price_log.csv
          if git diff --cached --quiet; then
            echo "No price changes to commit."
            exit 0
          fi
          git commit -m "Auto-update Friday Price [skip ci]"
          git push
