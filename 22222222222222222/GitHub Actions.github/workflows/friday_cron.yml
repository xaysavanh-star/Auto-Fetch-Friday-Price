name: Auto Fetch Friday Price

on:
  schedule:
    # Run ທຸກໆວັນສຸກ ຕອນເວລາ 05:00 UTC (ປະມານ 12:00 ໂມງທ່ຽງ ຢູ່ລາວ)
    - cron: '0 5 * * 5'
    # Run ທຸກໆວັນສຸກ ຕອນເວລາ 16:55 UTC (ປະມານ 23:55 ໂມງກາງຄືນ ຢູ່ລາວ)
    - cron: '55 16 * * 5'
  workflow_dispatch: # ອະນຸຍາດໃຫ້ກົດ Run ເອງເພື່ອທົດສອບໄດ້

jobs:
  fetch-price:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-python: '3.10'

    - name: Install dependencies
      run: |
        pip install yfinance pandas

    - name: Run script
      run: python fetch_friday_price.py

    - name: Commit and Push changes
      run: |
        git config --global user.name 'FridayBot'
        git config --global user.email 'bot@friday.effect'
        git add friday_auto_price_log.csv
        git commit -m "Auto-update Friday Price [skip ci]" || exit 0
        git push